  <meta property="og:url" content="https://z01.hktrpg.com/">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#dd0000">
  <script>
    (function () {
      var KEY = 'udonarium.ui.locale';
      var dict = {
        'zh-TW': {
          lang: 'zh-Hant',
          loading: '載入中…',
          title: '烏冬桌 @ HKTRPG',
          ogTitle: '烏冬桌 @ HKTRPG',
          og: 'HKTRPG 線上 TRPG 桌面（Udonarium）：地圖、棋子、立繪、聊天與擲骰。',
          noscript: '請啟用 JavaScript 後繼續使用本應用程式。'
        },
        'zh-CN': {
          lang: 'zh-Hans',
          loading: '加载中…',
          title: '乌冬桌 @ HKTRPG',
          ogTitle: '乌冬桌 @ HKTRPG',
          og: 'HKTRPG 线上 TRPG 桌面（Udonarium）：地图、棋子、立绘、聊天与掷骰。',
          noscript: '请启用 JavaScript 后继续使用本应用程序。'
        },
        en: {
          lang: 'en',
          loading: 'Now Loading.',
          title: 'Udon @ HKTRPG',
          ogTitle: 'Udon @ HKTRPG',
          og: 'HKTRPG online TRPG tabletop (Udonarium): maps, tokens, stands, chat, and dice.',
          noscript: 'Please enable JavaScript to continue using this application.'
        },
        ja: {
          lang: 'ja',
          loading: '読み込み中…',
          title: 'うどん卓 @ HKTRPG',
          ogTitle: 'うどん卓 @ HKTRPG',
          og: 'HKTRPG のオンライン TRPG 卓（Udonarium）：マップ・駒・立ち絵・チャット・ダイス。',
          noscript: 'このアプリケーションを使うには JavaScript を有効にしてください。'
        }
      };
      var locale = 'zh-TW';
      try {
        var stored = localStorage.getItem(KEY);
        if (stored && dict[stored]) locale = stored;
      } catch (e) { /* ignore */ }
      var d = dict[locale];
      document.documentElement.lang = d.lang;
      document.documentElement.setAttribute('data-ui-locale', locale);
      window.__UDON_SHELL_I18N__ = d;
      document.addEventListener('DOMContentLoaded', function () {
        var loading = document.getElementById('boot-loading-title');
        if (loading) loading.textContent = d.loading;
        var docTitle = document.getElementById('document-title');
        if (docTitle) docTitle.textContent = d.title;
        document.title = d.title;
        var ogTitle = document.getElementById('og-title');
        if (ogTitle) ogTitle.setAttribute('content', d.ogTitle);
        var og = document.getElementById('og-description');
        if (og) og.setAttribute('content', d.og);
        var noscript = document.getElementById('boot-noscript');
        if (noscript) noscript.textContent = d.noscript;
      });
    })();
  </script>
  <!-- Kick SW update during the loading screen (before Angular boots). -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) return reg.update();
      }).catch(function () { /* ignore */ });
    })();
  </script>
</head>
<body>
  <app-root>
    <div class="sk-cube-grid">

      <div class="sk-cube sk-cube4"></div>
      <div class="sk-cube sk-cube5"></div>
      <div class="sk-cube sk-cube6"></div>
      <div class="sk-cube sk-cube7"></div>
      <div class="sk-cube sk-cube8"></div>
      <div class="sk-cube sk-cube9"></div>
      <div id="boot-loading-title" class="sk-title">載入中…</div>
    </div>
  </app-root>
  <script type="text/yaml" src="./assets/config.yaml"></script>
  <script type="text/javascript" src="https://www.youtube.com/iframe_api"></script>
  <noscript id="boot-noscript">Please enable JavaScript to continue using this application. / 請啟用 JavaScript 後繼續使用本應用程式。 / 请启用 JavaScript 后继续使用本应用程序。 / このアプリケーションを使うには JavaScript を有効にしてください。</noscript>
</body>
