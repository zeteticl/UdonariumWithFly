<div class="settings-ui dense settings-layout" *ngIf="!GuestMode()" appFitPanel [fitMinHeight]="300" [fitMaxHeight]="560">
  <aside class="settings-aside">
    <button type="button" class="btn btn-primary btn-block" (click)="add()">
      <i class="material-icons">add</i>{{ 'diceTable.add' | i18n }}
    </button>
    <select
      #diceRollTableSelecter
      class="settings-list"
      size="15"
      (change)="onChangeDiceRollTable(diceRollTableSelecter.value)"
    >
      <option
        *ngFor="let diceRollTable of diceRollTables"
        [value]="diceRollTable.identifier"
        [title]="diceRollTable.name"
        [class.is-unnamed]="diceRollTable.name == ''"
      >
        {{ diceRollTable.name == '' ? ('diceTable.unnamed' | i18n) : diceRollTable.name }}
      </option>
    </select>
  </aside>

  <main class="settings-main" *ngIf="!isEmpty && selectedDiceRollTable">
    <section class="card">
      <header class="card-head">
        <h3>{{ 'diceTable.title' | i18n }}</h3>
        <button type="button" class="btn btn-sm" (click)="helpDiceRollTable()" title="?">?</button>
      </header>
      <div class="field-row wrap">
        <label class="field grow" [class.disabled]="!isEditable">
          <span>{{ 'diceTable.name' | i18n }}</span>
          <input
            type="text"
            [(ngModel)]="diceRollTableName"
            [placeholder]="'diceTable.name' | i18n"
            [disabled]="!isEditable"
          />
        </label>
        <label class="field" [class.disabled]="!isEditable">
          <span>{{ 'diceTable.command' | i18n }}</span>
          <input
            type="text"
            [(ngModel)]="diceRollTableCommand"
            [placeholder]="'diceTable.command' | i18n"
            [disabled]="!isEditable"
          />
        </label>
        <label class="field" [class.disabled]="!isEditable">
          <span>{{ 'diceTable.dice' | i18n }}</span>
          <input
            type="text"
            [(ngModel)]="diceRollTableDice"
            [placeholder]="'diceTable.dice' | i18n"
            [disabled]="!isEditable"
          />
        </label>
      </div>
      <div class="field-row">
        <label class="field grow" [class.disabled]="!isEditable">
          <textarea
            [(ngModel)]="diceRollTableText"
            [placeholder]="'diceTable.textPlaceholder' | i18n"
            [disabled]="!isEditable"
            class="dice-text"
          ></textarea>
        </label>
      </div>
    </section>

    <footer class="actions">
      <ng-container *ngIf="!isDeleted">
        <button type="button" class="btn btn-sm" (click)="upTabIndex()">↑</button>
        <button type="button" class="btn btn-sm" (click)="downTabIndex()">↓</button>
        <span class="actions-spacer">
          <button type="button" class="btn" (click)="importXml()">{{ 'sheet.import' | i18n }}</button>
          <button type="button" class="btn" [disabled]="isSaveing" (click)="save()">
            <span class="btn-label" [class.is-hidden]="isSaveing">{{ 'sheet.download' | i18n }}</span>
            <span *ngIf="isSaveing" class="btn-progress">{{progresPercent}}%</span>
          </button>
          <button type="button" class="btn btn-danger" (click)="delete()">{{ 'diceTable.delete' | i18n }}</button>
        </span>
      </ng-container>
      <ng-container *ngIf="isDeleted && selectedDiceRollTableXml">
        <button type="button" class="btn" (click)="restore()">{{ 'diceTable.restore' | i18n }}</button>
      </ng-container>
    </footer>
  </main>
</div>

<div class="settings-ui empty-hint" *ngIf="isEmpty">
  {{ 'diceTable.empty' | i18n }}
  <ng-container *ngIf="isDeleted && selectedDiceRollTableXml">
    <div class="actions" style="margin-top:8px">
      <button type="button" class="btn" (click)="restore()">{{ 'diceTable.restore' | i18n }}</button>
    </div>
  </ng-container>
</div>
