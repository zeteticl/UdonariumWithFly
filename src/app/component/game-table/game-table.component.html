<img style="visibility: hidden; pointer-events: none; position: absolute" [src]="backgroundImageUrl | safe: 'resourceUrl'" (load)="isBackgroundImageLoaded = true">
<img style="visibility: hidden; pointer-events: none; position: absolute" [src]="backgroundImageUrl2 | safe: 'resourceUrl'" (load)="isBackgroundImageLoaded2 = true">
<div class="background-image is-pointer-events-none" [ngClass]="[(backgroundFilterType ? 'is-filter' : ''), (isStealthMode && !isGMMode ? 'is-hide-in' : ''), backgroundFilterType]"
[style.background-image]="backgroundImageCss | safe: 'style'"></div>
<div class="component is-fill is-perspective" [ngClass]="{'is-grabbing': isPointerDragging}" #root>
  <div class="component-content is-fill is-3d" #gameTable>
    <div id="app-game-table" class="game-table table-image is-3d" [style.background-image]="'url(' + tableImageUrl + ')' | safe: 'style'" #gameObjects>
      <canvas class="grid-canvas is-fill is-pointer-events-none" #gridCanvas [ngStyle]="{'transform': 'translateZ(' + (gridHeight + 0.1) + 'px)', 'clip': clipCss}"></canvas>
      <svg class="drawings-layer is-fill is-pointer-events-none" [attr.width]="tablePixelWidth" [attr.height]="tablePixelHeight"
        [ngStyle]="{'transform': 'translateZ(' + (gridHeight + 0.2) + 'px)'}">
        <!-- Walls / light guides: only while scene-tools panel is open -->
        <g *ngIf="showSceneEditOverlay" class="walls-layer">
          <polyline *ngFor="let w of walls; trackBy: trackByGameObject"
            [attr.points]="wallPointsAttr(w)"
            fill="none" [attr.stroke]="isWallSelected(w) ? '#38bdf8' : (w.color || '#ffcc00')"
            [attr.stroke-width]="isWallSelected(w) ? 5 : 3" stroke-linecap="round" stroke-linejoin="round"
            [attr.stroke-dasharray]="w.blocksLight ? null : '6 4'" />
          <polyline *ngIf="wallDraftPoints.length" [attr.points]="draftPointsAttr(wallDraftPoints)"
            fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round" />
          <circle *ngFor="let p of wallDraftPoints" [attr.cx]="p.x" [attr.cy]="p.y" r="4" fill="#facc15" />
          <ng-container *ngIf="selectedLightGuide as lg">
            <circle [attr.cx]="lg.x" [attr.cy]="lg.y" [attr.r]="lg.dim" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85" />
            <circle [attr.cx]="lg.x" [attr.cy]="lg.y" [attr.r]="lg.bright" fill="none" stroke="#fde68a" stroke-width="1.5" opacity="0.9" />
          </ng-container>
          <ng-container *ngIf="lightDraft as ld">
            <circle [attr.cx]="ld.x" [attr.cy]="ld.y" [attr.r]="ld.dim" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" />
            <circle [attr.cx]="ld.x" [attr.cy]="ld.y" [attr.r]="ld.bright" fill="rgba(253,230,138,0.12)" stroke="#fde68a" stroke-width="2" />
            <circle [attr.cx]="ld.x" [attr.cy]="ld.y" r="5" fill="#f59e0b" />
          </ng-container>
        </g>
        <g *ngFor="let d of drawings; trackBy: trackByGameObject">
          <rect *ngIf="d.type === 'rect'" [attr.x]="d.x" [attr.y]="d.y" [attr.width]="d.width" [attr.height]="d.height"
            [attr.stroke]="isDrawingSelected(d) ? '#38bdf8' : d.strokeColor" [attr.stroke-width]="isDrawingSelected(d) ? d.strokeWidth + 2 : d.strokeWidth" [attr.stroke-opacity]="d.strokeOpacity"
            [attr.fill]="d.fillColor" [attr.fill-opacity]="d.fillOpacity" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse *ngIf="d.type === 'ellipse'" [attr.cx]="d.x + d.width/2" [attr.cy]="d.y + d.height/2"
            [attr.rx]="Math.abs(d.width/2)" [attr.ry]="Math.abs(d.height/2)"
            [attr.stroke]="isDrawingSelected(d) ? '#38bdf8' : d.strokeColor" [attr.stroke-width]="isDrawingSelected(d) ? d.strokeWidth + 2 : d.strokeWidth" [attr.stroke-opacity]="d.strokeOpacity"
            [attr.fill]="d.fillColor" [attr.fill-opacity]="d.fillOpacity" />
          <polyline *ngIf="d.type === 'polygon' || d.type === 'freehand'"
            [attr.points]="polylinePoints(d)"
            [attr.stroke]="isDrawingSelected(d) ? '#38bdf8' : d.strokeColor" [attr.stroke-width]="isDrawingSelected(d) ? d.strokeWidth + 2 : d.strokeWidth" [attr.stroke-opacity]="d.strokeOpacity"
            [attr.fill]="d.type === 'polygon' ? d.fillColor : 'none'" [attr.fill-opacity]="d.fillOpacity"
            stroke-linecap="round" stroke-linejoin="round" />
          <text *ngIf="d.type === 'text'" [attr.x]="d.x" [attr.y]="d.y + d.fontSize"
            [attr.fill]="isDrawingSelected(d) ? '#38bdf8' : d.strokeColor" [attr.font-size]="d.fontSize" [attr.opacity]="d.strokeOpacity"
            [attr.font-weight]="isDrawingSelected(d) ? 'bold' : 'normal'">{{ d.text }}</text>
        </g>
        <!-- Live draw drafts (local only; commit on pointerup) -->
        <g *ngIf="drawDraftTick >= 0 && (canCreateScene || canModifyScene)" class="draw-draft-layer">
          <polyline *ngIf="freehandDraftPoints.length > 1" [attr.points]="draftPointsAttr(freehandDraftPoints)"
            fill="none" [attr.stroke]="drawStrokeColor" [attr.stroke-width]="drawStrokeWidth"
            [attr.stroke-opacity]="drawStrokeOpacity" stroke-linecap="round" stroke-linejoin="round" />
          <circle *ngIf="freehandDraftPoints.length" [attr.cx]="freehandDraftPoints[freehandDraftPoints.length - 1].x"
            [attr.cy]="freehandDraftPoints[freehandDraftPoints.length - 1].y" [attr.r]="drawStrokeWidth / 2 + 1"
            [attr.fill]="drawStrokeColor" [attr.fill-opacity]="drawStrokeOpacity" />
          <rect *ngIf="shapeDraft && shapeDraft.kind === 'rect'"
            [attr.x]="shapeDraft.x" [attr.y]="shapeDraft.y" [attr.width]="shapeDraft.width" [attr.height]="shapeDraft.height"
            [attr.stroke]="drawStrokeColor" [attr.stroke-width]="drawStrokeWidth" [attr.stroke-opacity]="drawStrokeOpacity"
            [attr.fill]="drawStrokeColor" [attr.fill-opacity]="drawFillOpacity" stroke-dasharray="6 4" />
          <ellipse *ngIf="shapeDraft && shapeDraft.kind === 'ellipse'"
            [attr.cx]="shapeDraft.x + shapeDraft.width / 2" [attr.cy]="shapeDraft.y + shapeDraft.height / 2"
            [attr.rx]="Math.abs(shapeDraft.width / 2)" [attr.ry]="Math.abs(shapeDraft.height / 2)"
            [attr.stroke]="drawStrokeColor" [attr.stroke-width]="drawStrokeWidth" [attr.stroke-opacity]="drawStrokeOpacity"
            [attr.fill]="drawStrokeColor" [attr.fill-opacity]="drawFillOpacity" stroke-dasharray="6 4" />
          <polyline *ngIf="polygonDraftPoints.length" [attr.points]="draftPointsAttr(polygonRubberPoints)"
            fill="none" [attr.stroke]="drawStrokeColor" [attr.stroke-width]="drawStrokeWidth"
            [attr.stroke-opacity]="drawStrokeOpacity" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" />
          <circle *ngFor="let p of polygonDraftPoints" [attr.cx]="p.x" [attr.cy]="p.y" r="4"
            [attr.fill]="drawStrokeColor" />
        </g>
        <rect *ngIf="sceneMarquee as mq"
          [attr.x]="mq.x" [attr.y]="mq.y" [attr.width]="mq.width" [attr.height]="mq.height"
          fill="hsla(200, 100%, 60%, 0.12)" stroke="hsl(200, 100%, 50%)" stroke-width="1.5"
          stroke-dasharray="5 4" />
      </svg>
      <div class="is-fill is-3d is-pointer-events-none">
        <ng-container *ngFor="let terrain of terrains; trackBy: trackByGameObject; index as z">
          <ng-container *ngIf="terrain.detailDataElement && 0 < terrain.detailDataElement.children.length"><terrain class="is-3d" [style.z-index]="z + (terrain.height > 0 ? 0 : 10000)" [terrain]="terrain" [appTooltip]="terrain"></terrain></ng-container>
          <ng-container *ngIf="!terrain.detailDataElement || terrain.detailDataElement.children.length <= 0"><terrain class="is-3d" [style.z-index]="z + (terrain.height > 0 ? 0 : 10000)" [terrain]="terrain"></terrain></ng-container>
        </ng-container>
      </div>
      <!--
        Shared [ ] among card / note / mask / character: dense zindex.
        Stable DOM (id order) — never reorder on [ ] (that flashed every token).
        2D paint: CSS z-index (layer-flat-2d). 3D paint: micro translateZ on movable.
        Hosts stay transform-free (0×0 hosts with translateZ break tall-note hit tests).
        Hosts are pointer-events:none so only real content steals hits.
      -->
      <ng-container *ngFor="let piece of desktopLayerPieces; trackBy: trackByLayerPiece">
        <ng-container *ngIf="isLayerMask(piece)">
          <game-table-mask *ngIf="piece.detailDataElement && 0 < piece.detailDataElement.children.length" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-stack-id]="piece.identifier" [gameTableMask]="piece" [appTooltip]="piece" [ngStyle]="layerHostStyle(piece.zindex)"></game-table-mask>
          <game-table-mask *ngIf="!piece.detailDataElement || piece.detailDataElement.children.length <= 0" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-stack-id]="piece.identifier" [gameTableMask]="piece" [ngStyle]="layerHostStyle(piece.zindex)"></game-table-mask>
        </ng-container>
        <ng-container *ngIf="isLayerNote(piece)">
          <text-note *ngIf="piece.text != null && piece.text.trim() != ''" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-stack-id]="piece.identifier" [textNote]="piece" [appTooltip]="piece" [ngStyle]="layerHostStyle(piece.zindex)"></text-note>
          <text-note *ngIf="piece.text == null || piece.text.trim() === ''" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-stack-id]="piece.identifier" [textNote]="piece" [ngStyle]="layerHostStyle(piece.zindex)"></text-note>
        </ng-container>
        <card-stack *ngIf="isLayerCardStack(piece)" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-stack-id]="piece.identifier" [cardStack]="piece" [appTooltip]="piece" [ngStyle]="layerHostStyle(piece.zindex)"></card-stack>
        <card *ngIf="isLayerCard(piece)" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-stack-id]="piece.identifier" [card]="piece" [appTooltip]="piece" [ngStyle]="layerHostStyle(piece.zindex)"></card>
        <game-character *ngIf="isLayerCharacter(piece) && piece.character" class="is-3d layer-peer-host" [class.layer-flat-2d]="isTable2DMode" [attr.data-fb-id]="piece.identifier" [attr.data-fb-name]="piece.name" [attr.data-stack-id]="piece.identifier" [style.visibility]="piece.isLoaded && isTokenRevealedByVision(piece) ? 'visible' : 'hidden'" [ngStyle]="layerHostStyle(piece.zindex)" [characterToken]="piece" [gameCharacter]="piece.character" [appTooltip]="piece"></game-character>
      </ng-container>
      <range class="is-3d" *ngFor="let range of ranges; trackBy: trackByGameObject" [range]="range" [attr.data-stack-id]="range.identifier" [appTooltip]="range"></range>
      <dice-symbol class="is-3d" *ngFor="let diceSymbol of diceSymbols; trackBy: trackByGameObject" [attr.data-stack-id]="diceSymbol.identifier" [diceSymbol]="diceSymbol" [appTooltip]="diceSymbol"></dice-symbol>
      <peer-cursor *ngFor="let cursor of peerCursors; trackBy: trackByGameObject" class="is-3d" [cursor]="cursor" [style.display]="isCursorHidIn(cursor) && !isGMMode ? 'none' : ''"></peer-cursor>
      <canvas class="fx-canvas is-fill is-pointer-events-none" #fxCanvas
        [ngStyle]="{'transform': 'translateZ(' + (gridHeight + 2) + 'px)', 'clip': clipCss}"></canvas>
      <div class="weather-stack is-pointer-events-none is-3d" aria-hidden="true"
        [style.width.px]="weatherPixelWidth"
        [style.height.px]="weatherPixelHeight"
        [style.left.px]="-weatherPad"
        [style.top.px]="-weatherPad">
        <canvas class="weather-canvas" #weatherCanvasLow
          [ngStyle]="{'transform': 'translateZ(' + weatherLayerZ(0) + 'px)'}"></canvas>
        <canvas class="weather-canvas" #weatherCanvasMid
          [ngStyle]="{'transform': 'translateZ(' + weatherLayerZ(1) + 'px)'}"></canvas>
        <canvas class="weather-canvas" #weatherCanvasHigh
          [ngStyle]="{'transform': 'translateZ(' + weatherLayerZ(2) + 'px)'}"></canvas>
      </div>
      <div class="pings-layer is-fill is-pointer-events-none is-3d" [ngStyle]="{'transform': 'translateZ(' + (gridHeight + 2.2) + 'px)'}">
        <div *ngFor="let ping of pings" class="table-ping is-3d" [ngClass]="ping.type"
          [style.left.px]="ping.x" [style.top.px]="ping.y">
          <!-- basic: flat red rings on table -->
          <div class="ping-flat" *ngIf="ping.type === 'basic'">
            <div class="ping-ring ring-a"></div>
            <div class="ping-ring ring-b"></div>
            <div class="ping-ring ring-c"></div>
            <div class="ping-flat-core"></div>
          </div>
          <!-- Shift: upright 3D warning ! (token-like, bobbing) -->
          <div class="ping-upright is-3d" *ngIf="ping.type === 'warning'">
            <div class="ping-ground-ring ring-a"></div>
            <div class="ping-ground-ring ring-b"></div>
            <div class="ping-token is-3d">
              <div class="ping-warning-plate">!</div>
            </div>
          </div>
        </div>
      </div>
      <div *ngIf="showSceneEditOverlay" class="edit-markers is-pointer-events-none" [ngStyle]="{'transform': 'translateZ(' + (gridHeight + 1.5) + 'px)'}">
        <div *ngFor="let light of lights" class="light-marker" [class.selected]="isLightSelected(light)"
          [style.left.px]="light.x - 8" [style.top.px]="light.y - 8" title="{{ light.name }}"></div>
      </div>
      <div *ngIf="!isTable2DMode" class="clue-strings-3d is-pointer-events-none is-3d">
        <div *ngFor="let link of clueLinks; trackBy: trackByGameObject"
          class="clue-string-beam is-3d"
          [ngStyle]="clueStringBeamStyle(link)"></div>
      </div>
      <svg *ngIf="isTable2DMode" class="clue-strings-layer is-fill is-pointer-events-none is-3d"
        [attr.width]="tablePixelWidth" [attr.height]="tablePixelHeight"
        [ngStyle]="{'transform': 'translateZ(' + clueStringsZ + 'px)'}">
        <path *ngFor="let link of clueLinks; trackBy: trackByGameObject"
          class="clue-string"
          [attr.d]="cluePathD(link)"
          [attr.stroke]="link.color || '#c62828'" />
      </svg>
      <div *ngIf="pathWaypoints.length" class="path-waypoints is-pointer-events-none is-3d"
        [ngStyle]="{'transform': 'translateZ(' + (gridHeight + 2.3) + 'px)'}">
        <svg class="path-line is-fill" [attr.width]="tablePixelWidth" [attr.height]="tablePixelHeight">
          <polyline *ngIf="pathPointsAttr" [attr.points]="pathPointsAttr"
            fill="none" stroke="hsla(200, 90%, 55%, 0.85)" stroke-width="2" stroke-dasharray="6 4"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div *ngFor="let p of pathWaypoints; let i = index" class="path-dot"
          [style.left.px]="p.x" [style.top.px]="p.y">{{ i + 1 }}</div>
      </div>
    </div>
  </div>
  <!-- Foundry-style Alt: screen AABB outlines (above peers). pointer-events none. -->
  <div class="canvas-highlight-layer is-pointer-events-none" *ngIf="canvasHighlightActive"
    aria-hidden="true">
    <div class="canvas-highlight-box" *ngFor="let box of canvasHighlightBoxes; trackBy: trackByHighlightBox"
      [style.left.px]="box.left" [style.top.px]="box.top"
      [style.width.px]="box.width" [style.height.px]="box.height"></div>
  </div>
</div>
<div class="pick-area" #pickArea></div>
<div class="pick-cursor" #pickCursor>
  <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="15" />
  </svg>
</div>
<div class="offscreen-pings">
  <div *ngFor="let arrow of offscreenArrows" class="offscreen-arrow" [style.transform]="'translate(' + arrow.x + 'px,' + arrow.y + 'px) rotate(' + arrow.deg + 'deg)'"
    [style.border-bottom-color]="arrow.color"></div>
</div>
<div class="path-move-hud" *ngIf="showPathMoveHud">{{ 'tip.pathMove.hud' | i18n }}</div>
<div class="vision-banner" *ngIf="showVisionBanner">{{ 'tip.vision.noCharacter' | i18n }}</div>
<aside class="debug-pose" *ngIf="showDebugPose">
  <header class="debug-pose-hd">
    <span>DEBUG pose</span>
    <span class="debug-pose-hint">Ctrl+Shift+D</span>
    <button type="button" class="debug-pose-close" (click)="setShowDebugPose(false)" aria-label="Close">×</button>
  </header>
  <pre id="udon-debug-pose-body" class="debug-pose-body"></pre>
</aside>

<!-- Mobile map HUD: fixed TR zoom slider. -->
<div class="map-zoom-hud" *ngIf="showMapActionHud"
  (pointerdown)="$event.stopPropagation()"
  (touchstart)="$event.stopPropagation()"
  (mousedown)="$event.stopPropagation()"
  (contextmenu)="$event.preventDefault(); $event.stopPropagation()">
  <div class="map-hud-zoom"
    (pointerdown)="$event.stopPropagation()"
    (touchstart)="$event.stopPropagation()"
    (mousedown)="$event.stopPropagation()"
    (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
    (wheel)="$event.stopPropagation()">
    <button type="button" class="map-hud-zoom-reset"
      (click)="resetZoomSlider()"
      (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
      [attr.title]="'view.zoomReset' | i18n">{{ zoomSliderValue > 0 ? '+' : '' }}{{ zoomSliderValue }}</button>
    <input
      class="map-hud-zoom-range"
      type="range"
      min="-100"
      max="100"
      step="1"
      [value]="zoomSliderValue"
      (input)="onZoomSliderInput($event)"
      (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
      [attr.aria-label]="'view.zoom' | i18n"
    />
  </div>
</div>
