<div class="settings-ui dense file-storage">
  <section class="card" *ngIf="!GuestMode()">
    <label class="drop-zone-wrap">
      <span class="drop-zone">
        <i class="material-icons">add_photo_alternate</i>
        <span class="drop-zone-title">{{ 'file.drop' | i18n }}</span>
        <span class="drop-zone-sub">{{ 'file.orClick' | i18n }}</span>
        <span class="drop-zone-sub">{{ 'file.maxSize' | i18n }}</span>
        <input type="file" hidden (change)="handleFileSelect($event)" multiple accept="image/*" />
      </span>
    </label>
  </section>

  <section class="card filter-card sticky-top">
    <header class="card-head">
      <h3>{{ 'file.title' | i18n }}</h3>
      <label class="icon-toggle" [title]="'table.showHiddenImages' | i18n">
        <input
          name="show-hide-images"
          type="checkbox"
          [checked]="isShowHideImages"
          (click)="onShowHiddenImages($event)"
        >
        <i class="material-icons" [ngClass]="{'red-eye': isShowHideImages}">
          {{ isShowHideImages ? 'visibility' : 'visibility_off' }}
        </i>
      </label>
    </header>
    <div class="filter-row">
      <span class="word-selecter">
        <label>
          <input name="word-selecter" type="checkbox" value="ALL" [checked]="searchAllImage" (click)="onSearchAllImage()">
          <div class="all-tags"><b>{{ 'file.all' | i18n }}</b><badge class="badge" [count]="images.length" [@.disabled]="true"></badge></div>
        </label>
        <label *ngIf="countAllImagesHasWord(null) > 0">
          <input name="word-selecter" type="checkbox" value="No Tag" [(ngModel)]="searchNoTagImage" (change)="searchNoTagImage = (searchNoTagImage ? true : false)">
          <div class="no-tag"><s>{{ 'file.noTag' | i18n }}</s><badge *ngIf="countImagesHasWord(null) > 0" class="badge" [count]="countImagesHasWord(null)" [@.disabled]="true"></badge></div>
        </label>
        <label *ngFor="let word of allImagesOwnWords">
          <input name="word-selecter" type="checkbox" [value]="word" [checked]="searchWords.includes(word)" (change)="onSelectedWord(word)">
          <div>{{word}}<badge *ngIf="countImagesHasWord(word) > 0" class="badge" [count]="countImagesHasWord(word)" [@.disabled]="true"></badge></div>
        </label>
      </span>
      <span class="filter-controls">
        <select class="cond-select" [(ngModel)]="serchCondIsOr">
          <option value="true">{{ 'file.or' | i18n }}</option>
          <option value="">{{ 'file.and' | i18n }}</option>
        </select>
        <label class="sort-label" [attr.title]="'file.recentFirst' | i18n">
          <input name="is-sort" value="Sort" type="checkbox" [(ngModel)]="isSort" (change)="isSort = (isSort ? true : false)">
          {{ 'file.sort' | i18n }}
        </label>
      </span>
    </div>
  </section>

  <div id="file-list" class="file-list" [ngClass]="{ selecter: isSelected }" *ngIf="!GuestMode()">
    <div *ngFor="let file of images; trackBy: identify" class="image" @scaleInOut [ngClass]="{ selected: selected(file) }">
      <div class="image-meta">
        <ng-container *ngIf="getTagWords(file).length > 0; then tagsBlock; else noTagBlock"></ng-container>
        <ng-template #tagsBlock>
          <div class="tag-stack">
            <ng-container *ngFor="let word of getTagWords(file); index as i">
              <label *ngIf="i < 6" class="word-tag grow">{{ word }}</label>
              <span *ngIf="i == 6" class="grow more-tags">…</span>
            </ng-container>
          </div>
        </ng-template>
        <ng-template #noTagBlock>
          <div class="tag-stack">
            <s class="grow no-tag-label">{{ 'file.noTag' | i18n }}</s>
          </div>
        </ng-template>
        <div class="zoom-in">
          <button type="button" class="btn btn-sm zoom-button" (click)="chanageImageView(file)">
            <i class="material-icons">zoom_in</i>
          </button>
        </div>
      </div>
      <div *ngIf="getHidden(file)" class="hidden-badge">
        <i class="material-icons red-eye">visibility</i>
      </div>
      <span class="image-click" (click)="onSelectedFile(file)">
        <img *ngIf="0 < file.url.length" [src]="file.url | safe: 'resourceUrl'" [alt]="file.name" height="120" draggable="false" />
        <img *ngIf="file.url.length <= 0" src="assets/images/loading.gif" [alt]="file.name" draggable="false" />
      </span>
    </div>
  </div>

  <section *ngIf="isSelected" class="card sticky-bottom" @fadeAndUpInOut>
    <div class="selection-bar">
      <button type="button" class="btn btn-sm" (click)="onUnselect()">{{ 'file.cancelSelection' | i18n:{ count: selectedImageFiles.length } }}</button>
      <input class="tag-input" attr.list="{{panelId}}_suggest" type="text" [(ngModel)]="addingTagWord" [placeholder]="'file.tagsPlaceholder' | i18n">
      <button type="button" class="btn btn-sm btn-primary" [disabled]="addingTagWord == null || addingTagWord.trim() === ''" (click)="addTagWord()">{{ 'file.addTag' | i18n }}</button>
      <button
        type="button"
        class="btn btn-sm"
        [attr.title]="selectedImagesIsHidden ? ('file.show' | i18n) : ('file.hide' | i18n)"
        (click)="setectedImagesToHidden(!selectedImagesIsHidden)"
      >
        <i class="material-icons" [ngClass]="{'red-eye': selectedImagesIsHidden}">{{ selectedImagesIsHidden ? 'visibility' : 'visibility_off' }}</i>
      </button>
      <ng-container *ngIf="selectedImagesOwnWords().length > 0">
        <span class="selected-tags">
          <label *ngFor="let word of selectedImagesOwnWords()" class="word-tag removable" (click)="removeTagWord(word)">{{ word }}<sup>×</sup></label>
        </span>
      </ng-container>
      <ng-container *ngIf="selectedImagesOwnWords().length == 0">
        <span class="empty-hint" style="padding:0"><s>{{ 'file.noTag' | i18n }}</s></span>
      </ng-container>
    </div>
    <datalist id="{{panelId}}_suggest">
      <option *ngFor="let word of suggestWords()" [value]="word">{{word}}</option>
    </datalist>
  </section>
</div>
