<!--<h2>チャットシステム</h2>-->
<div class="component">
<div class="log">
  <chat-tab #chatTabComponemt *ngIf="chatTab" [chatTab]="chatTab" [compact]="isCompact" (onAddMessage)="scrollToBottom()"></chat-tab>
  <div *ngIf="!chatTab">※聊天標籤的內容已更新。 請重新選擇聊天標籤或重新打開此聊天窗口。</div>
</div>
<div class="sticky-bottom">
  <form>
    <div class="chat-tab"  *ngIf="!ClarifyMode()>
      <label *ngFor="let chatTab of chatMessageService.chatTabs; trackBy: trackByChatTab" class="tab">
        <input name="chat-tab" type="radio" value="{{chatTab.identifier}}" ng-control="options" [(ngModel)]="chatTabidentifier">
        <div>{{chatTab.name}}<i *ngIf="chatTab.isUseStandImage" class="material-icons small-font">how_to_reg</i><i *ngIf="chatTab.recieveOperationLogLevel > 0" class="material-icons small-font">history_edu</i><badge *ngIf="chatTab.hasUnread" class="badge" [count]="chatTab.unreadLength"></badge></div>
      </label>
      <button class="tab-setting small-font" (click)="showTabSetting()"*ngIf="!GuestMode()"><i class="material-icons small-font">settings</i>標籤設定</button>
      <button class="tab-setting small-font" (click)="showLogOutput()"*ngIf="!GuestMode()"><i class="material-icons small-font">history_edu</i>LOG</button>
      <button class="tab-setting small-font" (click)="onSoundEffectSwitchChanged()">
        <i *ngIf="!SoundEffectSwitch2()" class="material-icons icon-size">highlight_off</i>
        <i *ngIf="SoundEffectSwitch2()" class="material-icons icon-size">radio_button_checked</i>
        效果音
      </button>
      <button class="tab-setting small-font" (click)="resetPointOfView()">
        <div><i class="material-icons icon-size">remove_red_eye</i>改變視點</div>
      </button>



      
      <label class="tab-setting small-font" style="padding: 1px 4px 1px 2px; margin-left: 2px; height: 24px; box-sizing: border-box" [ngClass]="{compact: isCompact}"><input name="isCompact" type="checkbox" [(ngModel)]="isCompact" [value]="true" [checked]="isCompact" >簡易模式<sup style="color: red">*</sup></label>
    </div>
  </form>
  <chat-input [chatTabidentifier]="chatTabidentifier" [(gameType)]="gameType" [(sendFrom)]="sendFrom" (chat)="sendChat($event)"></chat-input>
</div>
<!--<div style="white-space:pre-wrap; font-size: 8px;"><span>{{gameHelp}}</span></div>-->
