<div [@flyInOut]="'in'"
  [ngClass]="{
    'pointer-events-none': isPointerDragging,
    'is-full-screen': isFullScreen,
    'is-minimized': isMinimized && !isFullScreen,
    'i-am-gm': isGMMode,
    'is-mobile-sheet': isMobileSheet,
    'is-mobile-sheet-half': isMobileSheetHalf,
    'is-snap-peek': isMobileSheet && !isSheetCustomHeight && mobileSheetSnap === 'peek',
    'is-snap-half': isMobileSheet && !isSheetCustomHeight && mobileSheetSnap === 'half',
    'is-sheet-custom': isMobileSheet && isSheetCustomHeight
  }"
  class="draggable-panel"
  [attr.data-tour-panel]="panelService.tourPanelId || null"
  [attr.data-geometry-key]="panelService.geometryKey || null"
  [style.left.px]="left" [style.top.px]="top" [style.width.px]="width" [style.height.px]="height"
  [resizable.disable]="isMinimized || isFullScreen || isMobileSheet" [resizable.align]="isMobileSheet ? 'vertical' : (!isAbleRotateButton ? 'normal' : isHorizontal ? 'horizontal' : 'vertical')" [draggable.disable]="isFullScreen || isMobileSheet"
  [draggable.handle]="'.title'" [draggable.stack]="'.draggable-panel'" [resizable.stack]="'.draggable-panel'"
  (resizable.start)="onPanelResizeStart()" (resizable.end)="onPanelGeometryEnd()" (draggable.end)="onPanelGeometryEnd()"
  appDraggable appResizable #draggablePanel>
  <div class="title" #titleBar (dblclick)="onTitleDblClick($event)" (click)="onMobileTitleTap($event)">
    <div *ngIf="isMobileSheet" class="sheet-resize-bar"
      (pointerdown)="startSheetResize($event)"
      [attr.title]="'hud.resizeSheet' | i18n"
      [attr.aria-label]="'hud.resizeSheet' | i18n">
      <div class="sheet-handle" aria-hidden="true"></div>
    </div>
    <button *ngIf="isAbleRotateButton" style="padding: 0px; height: 14px; margin-top: 4px; margin-left: 5px" (dblclick)="notOperaion($event)" (click)="toggleRotate($event)"><i class="material-icons" style="font-size: 14px;">pivot_table_chart</i></button>
    <div class="title-text" [ngClass]="{'rotateble': isAbleRotateButton}">{{panelService.title}}</div>
    <div class="title-button">
      <button *ngIf="isAbleMinimizeButton" (dblclick)="notOperaion($event)" (click)="toggleMinimize($event)"><i class="material-icons" [style.font-size.px]="isMinimized || (isMobileSheet && mobileSheetSnap === 'peek') ? 12 : 14">{{ isMinimized || (isMobileSheet && mobileSheetSnap === 'peek') ? 'crop_din' : 'minimize' }}</i></button>
      <button *ngIf="isAbleFullScreenButton" (dblclick)="notOperaion($event)" (click)="toggleFullScreen($event)"><i class="material-icons" [style.font-size.px]="isFullScreen && !isMinimized ? 12 : 14">{{ !isFullScreen ? 'fullscreen' : !isMinimized ? 'crop_din' : 'minimize' }}</i></button>
      <button *ngIf="isAbleCloseButton" (dblclick)="notOperaion($event)" (click)="close($event)"><i class="material-icons" style="font-size: 14px">close</i></button>
    </div>
  </div>
  <div class="scrollable-panel" [ngClass]="{'overlay': isAbleRotateButton, 'horizontal': isHorizontal}" [style.display]="isMinimized && !isFullScreen ? 'none' : null" #scrollablePanel>
    <ng-content></ng-content>
    <div class="panel-body" #content></div>
  </div>
</div>
