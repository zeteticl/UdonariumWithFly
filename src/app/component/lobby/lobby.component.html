<div class="settings-ui dense" appFitPanel [fitMinHeight]="280" [fitMaxHeight]="560">
  <section class="card">
    <header class="card-head"><h3>{{ 'lobby.title' | i18n }}</h3></header>
    <div class="actions">
      <button type="button" class="btn" (click)="reload()" [disabled]="isReloading">
        <i class="material-icons">refresh</i>{{ 'lobby.refresh' | i18n }}
      </button>
      <button type="button" class="btn btn-primary" (click)="showRoomSetting()" [disabled]="connectionBusy.busy">
        <i class="material-icons">room_preferences</i>{{ 'lobby.createRoom' | i18n }}
      </button>
      <button type="button" class="btn" *ngIf="canShowLoadRoom" (click)="loadFolderBackup()"
        [disabled]="isFolderLoadDisabled"
        [title]="isFolderLoadDisabled
          ? ('peer.loadData.gmOnly' | i18n)
          : (folderBackup.isReady
            ? ('menu.folderBackup.autoStoreHint' | i18n)
            : (folderBackupActionLabelKey | i18n))">
        <i class="material-icons">{{ folderBackup.isReady ? 'folder_open' : 'create_new_folder' }}</i>{{ folderBackupActionLabelKey | i18n }}<ng-container *ngIf="isFolderLoadDisabled">（{{ 'peer.loadData.gmOnly' | i18n }}）</ng-container>
      </button>
    </div>

    <div class="room-table-wrap" *ngIf="rooms.length">
      <table class="room-list">
        <tr>
          <th class="is-0-width is-small-font">{{ 'lobby.colId' | i18n }}</th>
          <th class="is-small-font">{{ 'lobby.colName' | i18n }}</th>
          <th class="is-0-width is-small-font">{{ 'lobby.colPassword' | i18n }}</th>
          <th class="is-0-width is-small-font">{{ 'lobby.colPeers' | i18n }}</th>
          <th class="is-0-width is-small-font"></th>
        </tr>
        <ng-container *ngFor="let room of rooms">
          <tr>
            <td class="room-id">{{room.id}}</td>
            <td class="room-name"><div class="room-name-text">{{displayRoomName(room)}}</div></td>
            <td *ngIf="roomHasLock(room)">
              <i class="material-icons lock-icon">lock</i>
            </td>
            <td *ngIf="!roomHasLock(room)">-</td>
            <td>{{ 'lobby.peerCount' | i18n:{ count: room.peers.length } }}</td>
            <td class="room-actions">
              <ng-container *ngIf="isRoleAuthRoom(room)">
                <button type="button" class="btn btn-sm btn-primary" [disabled]="connectionBusy.busy || room.id === currentRoom" *ngIf="0 < room.id.length" (click)="connect(room)">{{ 'lobby.joinWithRole' | i18n }}</button>
              </ng-container>
              <ng-container *ngIf="!isRoleAuthRoom(room)">
                <button type="button" class="btn btn-sm btn-primary" [disabled]="connectionBusy.busy || room.id === currentRoom" *ngIf="0 < room.id.length" (click)="connect(room, false)">{{ 'lobby.connect' | i18n }}</button>
                <button type="button" class="btn btn-sm" [disabled]="connectionBusy.busy || room.id === currentRoom" *ngIf="0 < room.id.length && isAllowGuest(room)" (click)="connect(room, true)">{{ 'lobby.guest' | i18n }}</button>
              </ng-container>
            </td>
          </tr>
        </ng-container>
      </table>
    </div>
    <p class="empty-hint" *ngIf="rooms.length < 1">{{help}}</p>
  </section>
</div>
