<div class="component is-3d is-pointer-events-none"
  [style.width.px]="width * gridSize" [style.height.px]="depth * gridSize"
  appMovable [movable.option]="movableOption" [movable.disable]="isLocked" [movable.interact]="isInteract" (movable.ondragstart)="onMove()" (movable.ondragend)="onMoved()">
  <div class="component-content is-3d is-pointer-events-auto" [ngClass]="{'is-grab': !isLocked}" (dblclick)="onDoubleClick($event)"
    appRotable [rotable.option]="rotableOption" (rotable.ondragstart)="onMove()" (rotable.ondragend)="onMoved()" [rotable.disable]="isLocked"
    [ngStyle]="neonStyle">
    <!-- Enlarged pick target for thin signs / bridges (visual size unchanged). -->
    <div *ngIf="needsHitPad" class="thin-hit-pad is-3d"
      [style.transform]="'scale(' + hitPadScaleX + ', ' + hitPadScaleY + ')'"></div>
    <ng-container *ngIf="hasFloor && isVisibleFloor && 0 < floorImageUrl.length">
      <div *ngIf="isDropShadow && (terreinAltitude != 0 || (isSlope && !hasWall))"
        style="opacity: 0.7; filter: brightness(0) blur(1px); transform: translateZ(0.3px) scale(0.98); backface-visibility: visible"
        class="is-3d texture chrome-smooth-image-trick" [ngClass]="{'blinking-animation': !isLocked}" [style.background-image]="'url(' + floorImageUrl + ')' | safe: 'style'"
        [style.background-size]="cropBgSize('floor')" [style.background-position]="cropBgPos('floor')">
      </div>
      <div *ngIf="isSelected && isDropShadow && (terreinAltitude != 0 || (isSlope && !hasWall))" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
    </ng-container>
    <div class="is-3d texture" style="z-index: 1" [ngClass]="{'upright-transform': (height < 0.5 && altitude == 0), 'fall': (height >= 0.5 && altitude == 0)}" [ngStyle]="{transform: 'translateZ(' + (altitude * gridSize) + 'px)'}">
      <ng-container *ngIf="hasFloor && isVisibleFloor && 0 < floorImageUrl.length">
        <div class="is-3d texture chrome-smooth-image-trick" [ngClass]="neonFloorClass + (isLocked ? '' : ' blinking-animation')"
          [ngStyle]="{'backface-visibility': isSlope ? 'visible' : 'hidden', 'transform': 'translateZ(' + ((height / (isSlope ? 2 : 1)) * gridSize) + 'px)' + floorModCss, filter: floorFilterCss}"
          [style.background-image]="'url(' + floorImageUrl + ')' | safe: 'style'"
          [style.background-size]="cropBgSize('floor')" [style.background-position]="cropBgPos('floor')">
          <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
        </div>
      </ng-container>
      <ng-container *ngIf="isVisibleUnderside">
        <div class="is-3d texture of-underside chrome-smooth-image-trick" [ngClass]="{'blinking-animation': !isLocked, 'no-shadow': !isSurfaceShading}"
          [style.background-image]="'url(' + undersideImageUrl + ')' | safe: 'style'"
          [style.background-size]="cropBgSize('underside')" [style.background-position]="cropBgPos('underside')">
          <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
        </div>
      </ng-container>
      <ng-container *ngIf="isWallExist">
        <ng-container *ngIf="slopeDirection != slopeDirectionState.TOP">
          <div *ngIf="isVisibleWallTopBottom" [ngClass]="[neonWallClass, !isLocked ? 'blinking-animation' : '', !isSurfaceShading ? 'no-shadow' : '', slopeDirection == slopeDirectionState.LEFT ? 'is-slope' : '', slopeDirection == slopeDirectionState.RIGHT ? 'is-inverse-slope' : '', !mirrorWallTop ? 'no-mirror' : ''].join(' ').trim()" class="is-3d texture of-wall-top chrome-smooth-image-trick" [style.background-image]="'url(' + wallTopImageUrl + ')' | safe: 'style'"
            [style.background-size]="cropBgSize('wallTop')" [style.background-position]="cropBgPos('wallTop')"
            [style.width.px]="width * gridSize" [style.height.px]="height * gridSize"
            [style.transform]="mirrorWallTop ? 'translateY(-100%) rotateX(90deg) rotateZ(180deg) scaleX(-1.0)' : 'translateY(-100%) rotateX(90deg) rotateZ(180deg) scaleX(1.0)'">
            <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
          </div>
        </ng-container>
        <ng-container *ngIf="slopeDirection != slopeDirectionState.BOTTOM">
          <div *ngIf="isVisibleWallTopBottom" [ngClass]="[neonWallClass, !isLocked ? 'blinking-animation' : '', !isSurfaceShading ? 'no-shadow' : '', slopeDirection == slopeDirectionState.LEFT ? 'is-slope' : '', slopeDirection == slopeDirectionState.RIGHT ? 'is-inverse-slope' : ''].join(' ').trim()" class="is-3d texture of-wall-bottom chrome-smooth-image-trick" [style.background-image]="'url(' + wallBottomImageUrl + ')' | safe: 'style'"
            [style.background-size]="cropBgSize('wallBottom')" [style.background-position]="cropBgPos('wallBottom')"
            [style.width.px]="width * gridSize" [style.height.px]="height * gridSize"
            style="transform: rotateX(-90deg)">
            <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
          </div>
        </ng-container>
        <ng-container *ngIf="slopeDirection != slopeDirectionState.LEFT">
          <div *ngIf="isVisibleWallLeftRight" [ngClass]="[neonWallClass, !isLocked ? 'blinking-animation' : '', !isSurfaceShading ? 'no-shadow' : '', slopeDirection == slopeDirectionState.BOTTOM ? 'is-slope' : '', slopeDirection == slopeDirectionState.TOP ? 'is-inverse-slope' : '', !mirrorWallLeft ? 'no-mirror' : ''].join(' ').trim()" class="is-3d texture of-wall-left chrome-smooth-image-trick" [style.background-image]="'url(' + wallLeftImageUrl + ')' | safe: 'style'"
            [style.background-size]="cropBgSize('wallLeft')" [style.background-position]="cropBgPos('wallLeft')"
            [style.width.px]="depth * gridSize" [style.height.px]="height * gridSize"
            [style.transform]="wallLeftTransform">
            <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
          </div>
        </ng-container>
        <ng-container *ngIf="slopeDirection != slopeDirectionState.RIGHT">
          <div *ngIf="isVisibleWallLeftRight" [ngClass]="[neonWallClass, !isLocked ? 'blinking-animation' : '', !isSurfaceShading ? 'no-shadow' : '', slopeDirection == slopeDirectionState.BOTTOM ? 'is-slope' : '', slopeDirection == slopeDirectionState.TOP ? 'is-inverse-slope' : ''].join(' ').trim()" class="is-3d texture of-wall-right chrome-smooth-image-trick" [style.background-image]="'url(' + wallRightImageUrl + ')' | safe: 'style'"
            [style.background-size]="cropBgSize('wallRight')" [style.background-position]="cropBgPos('wallRight')"
            [style.width.px]="depth * gridSize" [style.height.px]="height * gridSize"
            style="transform: rotateZ(-90deg) rotateX(-90deg) translateY(-100%)">
            <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
          </div>
        </ng-container>
      </ng-container>
    </div>
    <ng-container *ngIf="!isLocked">
      <!-- Above textures (z-index 1); layer itself is PE-none so body stays movable. -->
      <div class="is-3d grab-layer" [style.opacity]="isInteract ? '1.0': '0.5'" [style.height.px]="depth * gridSize">
        <div class="pedestal-grab is-3d"></div>
        <div #scaleGrabLT class="resize-grab of-left-top resize-grab-icon is-3d is-pointer-events-auto" [attr.title]="'terrain.scaleGrabHint' | i18n">
          <i class="material-icons">open_in_full</i>
        </div>
        <div class="rotate-grab of-left-bottom rotate-grab-icon is-3d is-pointer-events-auto">
          <i class="material-icons">autorenew</i>
        </div>
        <div #scaleGrabRB class="resize-grab of-right-bottom resize-grab-icon is-3d is-pointer-events-auto" [attr.title]="'terrain.scaleGrabHint' | i18n">
          <i class="material-icons">open_in_full</i>
        </div>
        <div class="rotate-grab of-right-top rotate-grab-icon is-3d is-pointer-events-auto">
          <i class="material-icons">autorenew</i>
        </div>
      </div>
    </ng-container>
  </div>
  <div class="is-3d" *ngIf="isAltitudeIndicate && !((isSlope || isWallExist) && -height < altitude && altitude < 0) && (terreinAltitude <= -0.5 || 0.5 <= terreinAltitude)" style="display:flex; align-items: center; border-left: 2px dashed blanchedalmond; position: absolute; transform-origin: top left"
    [style.height.px]="math.abs(terreinAltitude * gridSize)"
    [ngStyle]="{transform: 'translateX(' + (width * gridSize / 2) + 'px) translateY(' + (-depth * gridSize / 2) + 'px) rotateX(-90deg) translateY(' + (terreinAltitude > 0 ? -(altitude + ((isSlope || isWallExist) ? 0 : height)) * gridSize : 0) + 'px) rotateY(' + (viewRotateZ) + 'deg)'}">
    <div class="altitude-indicator is-3d" style="position: absolute">{{ math.abs(terreinAltitude) }}</div>
    <div class="altitude-indicator is-3d" style="position: absolute; transform: rotateY(-180deg)">{{ math.abs(terreinAltitude) }}</div>
  </div>
</div>
