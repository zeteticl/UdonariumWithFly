<div class="settings-ui dense settings-layout" *ngIf="!GuestMode()" appFitPanel [fitMinHeight]="220" [fitMaxHeight]="480">
  <aside class="settings-aside">
    <select
      #select
      class="settings-list"
      size="10"
      multiple
      (change)="onChangeSelectTabs()"
      [disabled]="isAllTabs"
    >
      <option *ngFor="let chatTab of chatTabs" [value]="chatTab.identifier">{{ tabLabel(chatTab) }}</option>
    </select>
  </aside>

  <main class="settings-main" *ngIf="!isEmpty">
    <section class="card">
      <header class="card-head"><h3>{{ 'chatLog.title' | i18n }}</h3></header>

      <div class="radio-row">
        <span>{{ 'chatLog.tab' | i18n }}</span>
        <label>
          <input name="{{panelId}}-log-output-tab" type="radio" [(ngModel)]="isAllTabs" [value]="false" />
          {{ 'chatLog.selectedTabs' | i18n }}
        </label>
        <label>
          <input name="{{panelId}}-log-output-tab" type="radio" [(ngModel)]="isAllTabs" [value]="true" />
          {{ 'chatLog.allTabs' | i18n }}
        </label>
      </div>

      <div class="radio-row">
        <span>{{ 'chatLog.format' | i18n }}</span>
        <label>
          <input name="{{panelId}}-log-output-format" type="radio" [(ngModel)]="logFormat" [value]="0" />
          {{ 'chatLog.text' | i18n }}
        </label>
        <label>
          <input name="{{panelId}}-log-output-format" type="radio" [(ngModel)]="logFormat" [value]="1" />
          {{ 'chatLog.html' | i18n }}
        </label>
        <label>
          <input name="{{panelId}}-log-output-format" type="radio" [(ngModel)]="logFormat" [value]="2" />
          {{ 'chatLog.htmlWithImages' | i18n }}
        </label>
      </div>
      <p class="hint" [innerHTML]="'chatLog.htmlWithImagesHelp' | i18n"></p>

      <div class="radio-row">
        <span>{{ 'chatLog.time' | i18n }}</span>
        <label>
          <input name="{{panelId}}-log-output-timestamp-type" type="radio" [(ngModel)]="dateFormat" [value]="''" />
          {{ 'chatLog.none' | i18n }}
        </label>
        <label>
          <input name="{{panelId}}-log-output-timestamp-type" type="radio" [(ngModel)]="dateFormat" [value]="'HH:mm'" />
          {{ 'chatLog.hoursMinutes' | i18n }}
        </label>
        <label>
          <input name="{{panelId}}-log-output-timestamp-type" type="radio" [(ngModel)]="dateFormat" [value]="'yyyy/MM/dd HH:mm'" />
          {{ 'chatLog.dateTime' | i18n }}
        </label>
      </div>

      <div class="check-row">
        <label>
          <input type="checkbox" [(ngModel)]="isWriteOerationLog" />
          {{ 'chatLog.includeOperationLog' | i18n }}
        </label>
      </div>
    </section>

    <footer class="actions">
      <span class="actions-spacer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="logFormat < 2 ? saveLog() : saveLogWithImages()"
          [disabled]="isDisable"
        >
          <span class="btn-label" [class.is-hidden]="isSaveing">{{ 'chatLog.export' | i18n }}</span>
          <span *ngIf="isSaveing" class="btn-progress">{{progresPercent}}%</span>
        </button>
      </span>
    </footer>
  </main>
</div>

<div class="settings-ui empty-hint" *ngIf="isEmpty">
  {{ 'chatLog.empty' | i18n }}
</div>
